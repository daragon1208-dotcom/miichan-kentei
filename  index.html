<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2f8"><meta name="description" content="みーちゃんをどれだけ知ってる？全30問の4択検定！"><title>みーちゃん検定 🎀 30問スペシャル</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#633b53;background:#fff3f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 0%,#ffe0ef,transparent 45%),radial-gradient(circle at 95% 90%,#fce5ff,transparent 40%),#fff5fa}.wrap{max-width:650px;margin:auto;padding:24px 17px 60px}.brand{text-align:center;color:#d34e8a;font-weight:900;letter-spacing:.15em;font-size:14px}.card{background:#fff;border:1px solid #f8d6e6;border-radius:26px;padding:26px 21px;box-shadow:0 12px 32px #c76c9920;margin-top:18px}.hero{text-align:center;font-size:55px;margin:10px 0}h1{font-size:30px;line-height:1.4;margin:12px 0;color:#b83170}h2{font-size:23px;line-height:1.5;margin:12px 0 24px}p{line-height:1.9}.muted{color:#94758a;font-size:14px}.center{text-align:center}input{font:inherit;width:100%;padding:15px;border:2px solid #f4c4da;border-radius:15px;outline:none;background:#fffaff;color:#633b53}input:focus{border-color:#dd5d99}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary{background:linear-gradient(110deg,#ec71aa,#cf4e91);color:white;border:0;border-radius:16px;padding:16px 20px;font-weight:800;width:100%;margin-top:16px;box-shadow:0 5px 13px #c73d822b}.primary:disabled{opacity:.4;cursor:not-allowed}.secondary{border:2px solid #ed9fc5;color:#b83170;background:white;border-radius:14px;padding:12px 17px;font-weight:700}.progress{height:9px;background:#fbe0ed;border-radius:99px;overflow:hidden;margin:15px 0 23px}.bar{height:100%;background:linear-gradient(90deg,#f2a0c6,#d94c90);transition:width .25s}.option{display:flex;text-align:left;gap:12px;align-items:center;background:#fffafd;border:2px solid #f5d7e5;border-radius:16px;width:100%;padding:15px 13px;margin:10px 0;color:#67405a;line-height:1.6}.option b{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:#fbe1ee;color:#b63170}.option.selected{background:#ffecf5;border-color:#db5797}.option.selected b{background:#db5797;color:white}.option:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #b63777;outline-offset:2px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#a45a80;font-size:13px;font-weight:700}.score{font-size:68px;font-weight:900;color:#cf4e91;margin:0}.review{border-top:1px solid #f5d9e6;padding:17px 0}.review p{margin:5px 0}.right{color:#25826b}.wrong{color:#c6507c}.pill{display:inline-block;padding:5px 11px;background:#ffe5f0;border-radius:99px;font-size:12px;font-weight:800;color:#b83170}footer{text-align:center;margin-top:30px;font-size:12px;color:#9d7990}#app{min-height:55vh}@media(min-width:600px){.card{padding:35px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap"><div class="brand">♡ MI-CHAN KENTEI ♡</div><main id="app"></main><footer>🎀 みーちゃん検定 30問スペシャル 🎀<br>回答や名前はサーバーに保存されません</footer></div><script>
const QUESTIONS=[{"q": "高校時代、軽音楽部で初めて作ったオリジナル曲のタイトルは？", "options": ["ミーティングパラダイス", "ミーティングフォーエバー", "ミーティングエンドレス", "ミーティングレボリューション"], "correct": 1}, {"q": "高校時代、みーちゃんが音楽室でひとり黙々としていたことは？", "options": ["床の木目を数える", "楽器の製造番号を記録する", "防音壁に開いた穴を数える", "楽譜の音符を数える"], "correct": 2}, {"q": "高校のロサンゼルス旅行で、ホテルで起こした事件は？", "options": ["トイレを詰まらせた", "部屋の鍵をなくした", "浴室を水浸しにした", "ルームサービスを大量注文した"], "correct": 0}, {"q": "ロサンゼルスのホテルでトイレが詰まったとき、みーちゃんはどうした？", "options": ["翌朝まで放置した", "フロントまで走った", "友達に代わりに頼んだ", "部屋の電話からスタッフに連絡した"], "correct": 3}, {"q": "高校時代、みーちゃんの授業中の睡眠スタイルは？", "options": ["体育のあとだけ寝る", "先生の厳しさに関係なくどの授業でも寝る", "優しい先生の授業だけ寝る", "テスト前だけ寝ない"], "correct": 1}, {"q": "高校時代、テストでクラス最高点を取ったときの点数帯は？", "options": ["90点台", "70点台", "50点台", "20点台"], "correct": 3}, {"q": "中学生時代、みーちゃんが休み時間にしていたことは？", "options": ["四つ葉のクローバー探し", "砂鉄採取", "校庭の石の種類を分類", "アリの巣の観察"], "correct": 1}, {"q": "学生時代のみーちゃんのあだ名として実際にあったものは？", "options": ["くらぽん", "くらのん", "くらりん", "くらぴょん"], "correct": 1}, {"q": "小学生時代、先生に「うんとかすんとか言いなさい！」と言われたみーちゃんの返答は？", "options": ["うん", "なんで？", "すん", "無言でうなずいた"], "correct": 2}, {"q": "「みーちゃん」という呼び名は、もともと誰が使っていた？", "options": ["高校の友達", "軽音楽部の先輩", "小学校の先生", "家族や親戚"], "correct": 3}, {"q": "みーちゃんが午後2時頃、突然ひとりで行こうと決意した場所は？", "options": ["ユニバーサル・スタジオ・ジャパン", "東京ディズニーリゾート", "富士急ハイランド", "サンリオピューロランド"], "correct": 1}, {"q": "友達と遊ぶとき、みーちゃんはどのタイプ？", "options": ["基本的に誘われるのを待つ", "予定は友達に全部任せる", "自分から遊びや企画を提案する", "当日まで何をするか決めない"], "correct": 2}, {"q": "幼稚園の頃、みーちゃんが本気でなりたかったキャラクターは？", "options": ["美墨なぎさ（キュアブラック）", "雪城ほのか（キュアホワイト）", "九条ひかり（シャイニールミナス）", "春野はるか（キュアフローラ）"], "correct": 1}, {"q": "みーちゃんが友達のために企画した、ちょっと変わった記念セレモニーは？", "options": ["通院100回記念セレモニー", "早起き100日達成セレモニー", "引っ越し10回記念セレモニー", "同じ職場5周年セレモニー"], "correct": 0}, {"q": "15歳で初めてひとりで東京へ行ったみーちゃん。道中で起こった事件は？", "options": ["新幹線を反対方向に乗り間違えた", "降りる駅を通り過ぎた", "新幹線の切符をなくした", "東京駅で出口を間違えて迷子になった"], "correct": 2}, {"q": "みーちゃんが大切な人に対して、ついやってしまうことは？", "options": ["会うたびに小さなプレゼントを渡す", "相手の好きなものを徹底的に調べる", "最近あった出来事を端から端まで発表する", "次に会う予定を必ずその場で決める"], "correct": 2}, {"q": "子どもの頃、みーちゃんが異常なほどハマっていた飲み物は？", "options": ["野菜生活100", "充実野菜", "1日分の野菜", "野菜一日これ一本"], "correct": 1}, {"q": "みーちゃんが、まだ経験していないけれど人生で一度は挑戦したいことは？", "options": ["富士山の山頂まで登る", "スカイダイビングをする", "フルマラソンを完走する", "無人島で一泊する"], "correct": 0}, {"q": "みーちゃんが小学生から専門学生まで続けていた楽器は？", "options": ["エレキギター", "ベース", "ドラム", "サックス"], "correct": 2}, {"q": "みーちゃんが幼稚園から小学生まで習っていた楽器は？", "options": ["エレクトーン", "ピアノ", "バイオリン", "フルート"], "correct": 1}, {"q": "子どもの頃からみーちゃんが好きな、人力車のラーメンの味は？", "options": ["味噌", "塩豚骨", "魚介醤油", "醤油豚骨"], "correct": 3}, {"q": "みーちゃんが子どもの頃から苦手だった食べ物の組み合わせは？", "options": ["納豆とあんこ", "納豆と梅干し", "あんことレーズン", "レーズンと梅干し"], "correct": 0}, {"q": "みーちゃんが突然7日間の休みと自由に使えるお金を手に入れたら、挑戦したいことは？", "options": ["7日間で日本の全47都道府県を巡る", "7日間で日本の世界遺産を全部巡る", "7日間で日本の全県庁所在地を巡る", "7日間で全国の新幹線路線を乗り尽くす"], "correct": 0}, {"q": "みーちゃんが人と深く仲良くなるうえで、一番大切にしていることは？", "options": ["お互いに欠点が少なく価値観が似ていること", "相手の悪い部分を帳消しにできるほど大好きなところがあること", "どんなときも自分を最優先してくれること", "一度も喧嘩せず穏やかな関係を続けられること"], "correct": 1}, {"q": "みーちゃんが「これは誰にも負けない！」と思っている能力は？", "options": ["初対面の人と仲良くなる速さ", "一度見たものを記憶する力", "宣言したことを実現させる力", "長時間ひとつのことに集中する力"], "correct": 2}, {"q": "みーちゃんが学生時代に好きだった授業は？", "options": ["家庭科", "美術", "総合的な学習", "理科"], "correct": 2}, {"q": "中学1年生から専門学校卒業まで、みーちゃんの身に毎年起きていた出来事は？", "options": ["財布をなくした", "鳥のフンが落ちてきた", "自転車がパンクした", "同じ場所で転んだ"], "correct": 1}, {"q": "みーちゃんが専門学校の論文コンクールで取り上げたテーマは？", "options": ["鳥のフン", "睡眠と記憶力", "人間のくしゃみ", "夢を見る仕組み"], "correct": 0}, {"q": "みーちゃんが人生で一度は体験してみたい、憧れの生活は？", "options": ["専属シェフが毎日料理を作ってくれる生活", "お手伝いさんが家事をすべてしてくれる生活", "専属運転手がどこへでも送迎してくれる生活", "執事が身の回りのお世話をしてくれる生活"], "correct": 3}, {"q": "子どもの頃、勉強中にわからないことをお母さんに質問し、お母さんも答えられなかった場合、どう判断していた？", "options": ["大人でもわからない難問だから優先的に覚えようとした", "学校の先生に聞いて答えを突き止めようとした", "大人になっても必要ない知識だと判断し勉強の対象から外した", "お母さんと一緒に調べて二人で覚えることにした"], "correct": 2}];
const app=document.getElementById('app');let player='',items=[],step=0,answers=[];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function prepare(){items=shuffle(QUESTIONS.map((x,id)=>({...x,id})));/* Keep related episodes apart when possible */for(let i=1;i<items.length;i++){const related=(a,b)=>((a===2&&b===3)||(a===26&&b===27)||(a===18&&b===19));if(related(items[i-1].id,items[i].id)){let j=items.findIndex((x,k)=>k>i+1&&![items[i-1].id,items[i].id].includes(x.id));if(j>0)[items[i],items[j]]=[items[j],items[i]]}}items=items.map(x=>({...x,shown:shuffle(x.options.map((label,index)=>({label,correct:index===x.correct})))}));step=0;answers=[]}
function welcome(){app.innerHTML=`<section class="card center"><div class="hero">🎀🐰💗</div><div class="pill">全30問・4択チャレンジ</div><h1>みーちゃん検定</h1><p>あなたはみーちゃんのことを<br>どれだけ知ってる？👀💕</p><p class="muted">学生時代の珍事件から、意外な価値観まで。<br>30問でみーちゃん博士を目指そう！</p><div style="text-align:left;margin-top:26px"><label for="name"><strong>あなたのお名前</strong></label><input id="name" maxlength="30" placeholder="ニックネームを入力♡" autocomplete="nickname"></div><button class="primary" id="start">検定スタート ✨</button><p class="muted">途中で戻れません。回答は最後にまとめて確認できるよ！</p></section>`;document.getElementById('start').onclick=()=>{player=document.getElementById('name').value.trim()||'ゲスト';prepare();renderQ()}}
function renderQ(){const x=items[step];let choice=answers[step]??-1;app.innerHTML=`<section class="card"><div class="topline"><span>🎀 ${escapeHTML(player)} さん</span><span>QUESTION ${step+1} / 30</span></div><div class="progress"><div class="bar" style="width:${(step/30)*100}%"></div></div><h2>${escapeHTML(x.q)}</h2><div id="options">${x.shown.map((o,i)=>`<button class="option ${choice===i?'selected':''}" data-i="${i}" aria-pressed="${choice===i}"><b>${'ABCD'[i]}</b><span>${escapeHTML(o.label)}</span></button>`).join('')}</div><button class="primary" id="next" ${choice<0?'disabled':''}>${step===29?'結果を見る 🎉':'次の問題へ →'}</button><p class="muted center">選択してから「次の問題へ」を押してね ♡</p></section>`;document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{choice=Number(btn.dataset.i);answers[step]=choice;document.querySelectorAll('.option').forEach(b=>{const yes=Number(b.dataset.i)===choice;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',yes)});document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(choice<0)return;step++;if(step===30)results();else renderQ();window.scrollTo({top:0,behavior:'instant'})}}
function rank(score){if(score===30)return ['👑','みーちゃん本人説','もはや本人より本人に詳しい！？'];if(score>=26)return ['💎','みーちゃんマスター','愛と知識がすごすぎる！'];if(score>=21)return ['🎀','みーちゃん親衛隊','かなりの理解者！'];if(score>=15)return ['🌷','みーちゃん通','まだまだ知らない一面があるかも♡'];if(score>=8)return ['🐰','みーちゃん研究生','珍事件を復習してリベンジ！'];return ['🌱','みーちゃん入門生','ここから仲良くなろう！']}
function results(){const score=items.reduce((s,x,i)=>s+Number(x.shown[answers[i]].correct),0);const [emoji,title,desc]=rank(score);const share=`🎀 みーちゃん検定 🎀\n${player}の結果は ${score}/30問正解！\n称号：${title}\n${location.href.split('#')[0]}`;app.innerHTML=`<section class="card center"><div class="hero">${emoji}</div><div class="pill">検定結果発表！</div><h1>${escapeHTML(title)}</h1><p class="score">${score}<span style="font-size:22px;color:#a17c91"> / 30</span></p><p>${escapeHTML(player)}さん、おつかれさま！<br>${escapeHTML(desc)}</p><button class="primary" id="share">結果をシェアする 💌</button><button class="secondary" id="copy" style="width:100%;margin-top:12px">結果をコピー 📋</button><button class="secondary" id="again" style="width:100%;margin-top:12px">もう一度挑戦する 🔄</button></section><section class="card"><h2>📝 全30問の答え合わせ</h2><p class="muted">あなたの回答と正解をチェック！</p>${items.map((x,i)=>{const picked=x.shown[answers[i]],correct=x.shown.find(o=>o.correct);return `<div class="review"><span class="${picked.correct?'right':'wrong'}">${picked.correct?'✓ 正解':'✕ 不正解'}</span><p><strong>Q${i+1}. ${escapeHTML(x.q)}</strong></p><p class="muted">あなたの回答：${escapeHTML(picked.label)}</p><p class="right">正解：${escapeHTML(correct.label)}</p></div>`}).join('')}</section>`;document.getElementById('again').onclick=()=>{welcome();window.scrollTo(0,0)};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);alert('結果をコピーしたよ♡')}catch{prompt('結果をコピーしてね',share)}};document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'みーちゃん検定',text:share,url:location.href.split('#')[0]})}catch{}}else document.getElementById('copy').click()};window.scrollTo({top:0,behavior:'instant'})}
welcome();
</script></body></html>
