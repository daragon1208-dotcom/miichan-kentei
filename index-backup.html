<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffb5d4"><meta name="description" content="みーちゃんのこと、どれくらい知ってる？全15問のかわいい検定！">
<title>みーちゃん検定 ♡</title>
<style>
:root{--pink:#ef6da4;--ink:#69425a;--soft:#fff5fa;--line:#f6c9dd}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 12% 10%,#fff 0 3px,transparent 4px) 0 0/32px 32px,linear-gradient(145deg,#ffe5f1,#fff9fc 55%,#f9eaff);min-height:100vh}
main{max-width:560px;margin:auto;padding:24px 16px 50px}.shell{background:#fffdfef2;border:3px solid #fff;border-radius:30px;box-shadow:0 14px 45px #d86a9b2a;padding:24px 19px;text-align:center}
h1{font-size:clamp(32px,9vw,48px);margin:12px 0;color:#e95f99;text-shadow:2px 3px #ffe0ee;letter-spacing:.04em}
h2{font-size:23px;line-height:1.6;margin:16px 0}.eyebrow{font-weight:800;color:#dd72a0;letter-spacing:.18em;font-size:12px}
.sticker{font-size:55px;margin:18px 0;filter:drop-shadow(0 5px 0 #ffd7e8)}.pill{display:inline-block;background:#fff0f7;border:1px solid #ffd1e5;color:#c35b8c;border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px}
p{line-height:1.8}.muted{color:#9b788d;font-size:13px}.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px 16px;font-weight:900;font-size:17px;background:linear-gradient(90deg,#f47cad,#e85d9a);color:white;box-shadow:0 5px 0 #c84c81;cursor:pointer;margin-top:22px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c84c81}.btn.secondary{background:#fff0f7;color:#b84c7d;box-shadow:none;border:2px solid #f7c2d8}
input{width:100%;border:2px solid #f4c6d9;border-radius:15px;padding:14px;font-size:17px;text-align:center;outline-color:#e96ca3;background:white}
.option{display:block;text-align:left;width:100%;background:#fff;border:2px solid #f6d3e2;border-radius:16px;padding:14px 15px;margin:10px 0;font-size:16px;color:var(--ink);font-weight:700;cursor:pointer}
.option.selected{background:#ffe4f0;border-color:#e96ca3}.option span{color:#e66c9f;margin-right:12px}
.progress{height:10px;border-radius:20px;background:#ffe3ef;overflow:hidden;margin:18px 0 8px}.bar{height:100%;background:linear-gradient(90deg,#ff9dc6,#eb639d);transition:width .25s}
.topline{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#d76b9a;font-size:13px}.score{font-size:72px;color:#e65e98;font-weight:1000;line-height:1.2}.score small{font-size:20px}
.review{text-align:left;background:#fff6fa;border:1px solid #f6d3e2;border-radius:16px;padding:13px;margin:10px 0;font-size:13px;line-height:1.65}
.hidden{display:none}.footer{text-align:center;font-size:12px;color:#b5809d;margin-top:18px}
.decor{font-size:21px;letter-spacing:10px;color:#ef9bbf}.shareline{font-size:13px;overflow-wrap:anywhere;background:#fff1f7;border-radius:12px;padding:12px}
</style></head><body><main><div class="shell">
<section id="intro"><div class="eyebrow">WELCOME TO THE QUIZ ♡</div><div class="sticker">🎀💌✨</div><h1>みーちゃん検定</h1><div class="decor">♡ ☆ ♡</div><p><strong>あなたはみーちゃんのこと<br>どこまで知ってる？</strong></p><span class="pill">全15問 · 4択 · 100点満点</span><p class="muted">基本プロフィールからちょっと深い話まで。<br>目指せ、みーちゃんマスター！</p><label for="name"><strong>受験者のお名前（ニックネームOK）</strong></label><input id="name" maxlength="20" placeholder="お名前を入力してね ♡"><button class="btn" id="start">検定スタート ♡</button></section>
<section id="quiz" class="hidden"><div class="topline"><span id="stage"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="sticker" style="font-size:36px">💗</div><h2 id="question"></h2><div id="options"></div><button class="btn" id="next" disabled>次の問題へ →</button></section>
<section id="result" class="hidden"><div class="eyebrow">RESULT ♡</div><div class="sticker">🏆🎀💖</div><h1>結果発表！</h1><p id="who"></p><div class="score" id="score"></div><h2 id="rank"></h2><p id="comment"></p><span class="pill" id="correctCount"></span><button class="btn" id="share">結果をシェアする ♡</button><button class="btn secondary" id="copy">結果をコピー</button><button class="btn secondary" id="again">もう一度挑戦する</button><details style="margin-top:22px"><summary style="cursor:pointer;font-weight:800;color:#d26496">答え合わせを見る ♡</summary><div id="reviews"></div></details><p class="muted">※スコアはこの端末内だけで計算されます。<br>受験者ランキングの保存機能はありません。</p></section>
</div><div class="footer">made with ♡ for みーちゃん</div></main>
<script>
const Q=[{"q": "みーちゃんの誕生日は？", "a": ["11月1日", "12月1日", "12月12日", "1月1日"], "c": 1, "e": "12月1日！"}, {"q": "みーちゃんの血液型は？", "a": ["A型", "B型", "O型", "AB型"], "c": 2, "e": "O型！"}, {"q": "みーちゃんの出身地は？", "a": ["岐阜県", "長野県", "愛知県", "山梨県"], "c": 1, "e": "長野県！"}, {"q": "みーちゃんは何人きょうだい？", "a": ["一人っ子", "2人", "3人", "4人"], "c": 1, "e": "2人きょうだい！"}, {"q": "みーちゃんの身長は？", "a": ["155cm", "157cm", "158cm", "160cm"], "c": 2, "e": "158cm！"}, {"q": "みーちゃんが一番好きな食べ物は？", "a": ["焼肉", "お寿司", "ラーメン", "オムライス"], "c": 1, "e": "お寿司！"}, {"q": "みーちゃんが一番嫌いな食べ物は？", "a": ["トマト", "ピーマン", "納豆", "パクチー"], "c": 2, "e": "納豆！"}, {"q": "みーちゃんが好きな音楽ジャンルは？", "a": ["V系", "クラシック", "演歌", "EDM"], "c": 0, "e": "V系！"}, {"q": "みーちゃんが好きなキャラクターのシリーズは？", "a": ["すみっコぐらし", "ちいかわ", "リラックマ", "ポムポムプリン"], "c": 1, "e": "ちいかわ！"}, {"q": "みーちゃんが迎えたい犬種は？", "a": ["柴犬", "白いトイプードル", "ダックスフンド", "コーギー"], "c": 1, "e": "白いトイプードル！"}, {"q": "みーちゃんが欲しい車は？", "a": ["ミニクーパーのオープンカー", "ジムニー", "プリウス", "アルファード"], "c": 0, "e": "ミニクーパーのオープンカー！"}, {"q": "みーちゃんの以前のお仕事は？", "a": ["美容師", "保育士", "看護師", "パティシエ"], "c": 1, "e": "保育士！"}, {"q": "みーちゃんが最近診断されたMBTIは？", "a": ["ENFP", "ISTJ", "INFJ", "ESTP"], "c": 2, "e": "INFJ（提唱者）！"}, {"q": "みーちゃんが読書で気に入った言葉は？", "a": ["急がば回れ", "余白も愛情", "時は金なり", "勝てば官軍"], "c": 1, "e": "「余白も愛情」！"}, {"q": "みーちゃんが大切にしている考え方に近いのは？", "a": ["みんなに合わせるのが一番", "自分が納得できる選択をする", "失敗しないことが最優先", "好きなことは我慢する"], "c": 1, "e": "自分が納得できる選択！"}];
let idx=0,answers=[],nickname="";
const $=id=>document.getElementById(id);
const show=id=>["intro","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
$("start").onclick=()=>{nickname=$("name").value.trim()||"ゲスト";idx=0;answers=[];show("quiz");render()};
function render(){const q=Q[idx];$("stage").textContent=idx<5?"🌷 初級":idx<10?"🎀 中級":"👑 上級";$("counter").textContent=`${idx+1} / ${Q.length}`;$("bar").style.width=`${(idx+1)/Q.length*100}%`;$("question").textContent=q.q;$("options").replaceChildren();q.a.forEach((a,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span>${"ABCD"[i]}.</span>`;b.append(document.createTextNode(a));b.onclick=()=>{answers[idx]=i;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("next").disabled=false};$("options").append(b)});$("next").disabled=true;$("next").textContent=idx===Q.length-1?"結果を見る ♡":"次の問題へ →"}
$("next").onclick=()=>{if(answers[idx]===undefined)return;idx++;if(idx<Q.length)render();else finish()};
let shareText="";
function finish(){show("result");const n=Q.reduce((s,q,i)=>s+(answers[i]===q.c),0),score=Math.round(n/Q.length*100);let rank,comment;if(n===15){rank="👑 みーちゃんの神理解者";comment="全問正解！もはや本人レベル！？"}else if(n>=12){rank="💗 みーちゃんマスター";comment="かなり詳しい！みーちゃん愛を感じる♡"}else if(n>=9){rank="🎀 みーちゃん研究員";comment="いい感じ！あと一歩でマスター！"}else if(n>=5){rank="🌷 みーちゃん見習い";comment="まだまだ知らない一面があるみたい！"}else{rank="🐣 みーちゃん初心者";comment="ここからみーちゃん博士を目指そう！"}$("who").textContent=`${nickname} さんの成績`;$("score").innerHTML=`${score}<small> / 100点</small>`;$("rank").textContent=rank;$("comment").textContent=comment;$("correctCount").textContent=`${n} / ${Q.length}問 正解`;shareText=`🎀 みーちゃん検定 🎀\n${nickname} の結果は ${score}点！\n${rank}\n${location.href.split("?")[0]}\n#みーちゃん検定`;$("reviews").replaceChildren();Q.forEach((q,i)=>{let d=document.createElement("div");d.className="review";let head=document.createElement("strong");head.textContent=`${answers[i]===q.c?"⭕":"❌"} Q${i+1}. ${q.q}`;d.append(head,document.createElement("br"),document.createTextNode(`あなたの答え：${q.a[answers[i]]} ／ 正解：${q.a[q.c]}`),document.createElement("br"),document.createTextNode(q.e));$("reviews").append(d)})}
$("share").onclick=async()=>{if(navigator.share){try{await navigator.share({title:"みーちゃん検定",text:shareText});return}catch(e){if(e.name==="AbortError")return}}await copyText(shareText)};
async function copyText(t){try{await navigator.clipboard.writeText(t);alert("コピーしたよ♡")}catch(e){prompt("ここからコピーしてね♡",t)}}
$("copy").onclick=()=>copyText(shareText);$("again").onclick=()=>{show("intro")};
</script></body></html>
